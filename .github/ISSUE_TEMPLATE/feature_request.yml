name: Feature Request
description: Suggest a new feature or enhancement for Damien Email Wrestler
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe your idea in detail below.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocks workflow)
        - High (would significantly improve workflow)
        - Medium (nice to have)
        - Low (minor enhancement)
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature is this?
      options:
        - New Tool/Command
        - AI/ML Enhancement
        - Email Processing
        - Performance Improvement
        - User Experience
        - Integration
        - Documentation
        - Developer Tools
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        Describe the problem or limitation you're experiencing...
        Example: "Currently, I cannot organize emails by project, which makes it hard to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
      placeholder: |
        Describe how you'd like this feature to work...
        Example: "Add a new tool 'damien_organize_by_project' that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative approaches?
      placeholder: |
        Describe any alternative solutions or workarounds you've considered...

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Provide specific examples of how you would use this feature
      placeholder: |
        Example 1: As a developer, I want to...
        Example 2: When managing client emails, I need to...
    validations:
      required: true

  - type: textarea
    id: technical-details
    attributes:
      label: Technical Details (Optional)
      description: Any technical implementation details or suggestions
      placeholder: |
        - APIs to use
        - Architecture considerations
        - Dependencies
        - Performance requirements

  - type: textarea
    id: mockup
    attributes:
      label: Mockup/Example
      description: Show an example of expected input/output or interface
      placeholder: |
        Example command:
        ```bash
        damien organize-by-project --project "ClientA" --label "ClientA/Urgent"
        ```

        Expected output:
        ```
        Found 25 emails for ClientA
        Applied label: ClientA/Urgent
        ```
      render: markdown

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references
      placeholder: Add links to similar features, screenshots, or other relevant information...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following
      options:
        - label: I have searched existing issues/features to avoid duplicates
          required: true
        - label: This feature aligns with Damien's core purpose (email management & AI analysis)
          required: true
        - label: I am willing to help test this feature when implemented
          required: false
