name: Claude Code Action

on:
  workflow_dispatch:
    inputs:
      direct_prompt:
        description: 'Instructions for Claude'
        required: true
        type: string

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Claude Code Action
        uses: anthropics/claude-code-action@v0.0.33
        with:
          direct_prompt: ${{ github.event.inputs.direct_prompt }}
          github_token: ${{ secrets.GITHUB_TOKEN }}